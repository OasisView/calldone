name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default; gitleaks-action needs no extra scopes here.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # NOTE: actions/checkout & actions/setup-node may stay on @v4 (first-party);
      # SHA-pin them too in a later hardening pass. Third-party actions below are
      # pinned by commit SHA per security.md §7 / R22.
      - uses: actions/checkout@v4
        with:
          # gitleaks scans full history; needs the complete clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Plain workflow env, NOT secrets — these are public placeholders so the
          # lazy getSupabase() / SSG build succeeds with no real env (security.md §3.3).
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      # ---- supply-chain + secret hygiene (security.md §3.2, §7 / R22) ----
      - name: Dependency audit (fail on high/critical; documented allowlist)
        run: |
          # security.md §3.2: block high/critical advisories in the production tree.
          # npm has no native per-advisory ignore, so we post-process the JSON and fail
          # on any high/critical whose GHSA id is NOT justified in check-audit.mjs. The
          # `|| true` keeps npm's own non-zero exit from short-circuiting under pipefail;
          # the gate decision is made entirely by the script.
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node .github/scripts/check-audit.mjs "$RUNNER_TEMP/audit.json"

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action v3 hard-requires the auto-provisioned token to resolve the
          # PR commit range; without it the action errors on pull_request events. The
          # token inherits the workflow's least-privilege `contents: read`. Artifact
          # upload and PR comments are disabled so no write scopes are ever needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: VITE_ secret-name leak guard (security.md §3.2 #1)
        run: |
          if git grep -nE 'VITE_(GEMINI|GROQ|ELEVEN|BLAND|TWILIO|RESEND|SERVICE_ROLE)' -- src/; then
            echo "::error::A server secret name is exposed with a VITE_ prefix."
            exit 1
          fi

      - name: VITE_ allowlist (security.md §3.2 #2 — only the two public vars)
        run: |
          found=$(grep -RhoE 'import\.meta\.env\.VITE_[A-Z_]+' src/ | sort -u || true)
          expected=$(printf 'import.meta.env.VITE_SUPABASE_ANON_KEY\nimport.meta.env.VITE_SUPABASE_URL')
          if [ "$found" != "$expected" ]; then
            echo "::error::Unexpected VITE_ env references in src/."
            echo "found:"; echo "$found"
            echo "expected:"; echo "$expected"
            exit 1
          fi

      - name: BLAND_API_KEY must be absent (R12, security.md §3.2 #3)
        run: |
          if grep -rn 'BLAND_API_KEY' supabase/functions/ src/; then
            echo "::error::BLAND_API_KEY is referenced — real-call code is forbidden in this slice (R12)."
            exit 1
          fi

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Edge function tests
        run: |
          # Edge functions and their Deno tests are delivered by the ws/edge workstream.
          # Until that merges, supabase/functions has no test modules and `deno test`
          # treats "no test files found" as a hard error (exit 1). Run the suite when
          # tests exist; pass with a notice when they don't. Auto-activates once ws/edge
          # lands its *_test.ts files — no CI change needed at that point.
          if find supabase/functions -type f \( -name '*_test.ts' -o -name '*.test.ts' -o -name 'test.ts' \) 2>/dev/null | grep -q .; then
            deno test --allow-env supabase/functions
          else
            echo "No edge-function tests present yet (ws/edge not merged) — skipping deno test."
          fi
